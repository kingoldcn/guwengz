<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分级学习 · 古文观止</title>
<link rel="stylesheet" href="css/style.css">
<style>
.lvl-page{padding:24px 0 80px}
.lvl-head{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.lvl-head h1{font-family:var(--serif);font-size:28px;margin:0}
.lvl-head .sub{font-size:14px;color:var(--ink-soft);line-height:1.7}

.lvl-picks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.lvl-pick{background:var(--card);border-radius:var(--radius);padding:18px 16px;
  box-shadow:var(--shadow);border:1px solid var(--line);cursor:pointer;
  transition:.2s;text-align:left;position:relative;overflow:hidden}
.lvl-pick:hover{transform:translateY(-2px);border-color:var(--brand)}
.lvl-pick.active{border-color:var(--brand);box-shadow:0 6px 22px rgba(74,127,193,.18)}
.lvl-pick .tag{font-size:12px;font-weight:600;letter-spacing:1px;
  padding:3px 10px;border-radius:999px;display:inline-block;margin-bottom:8px;color:#fff}
.lvl-pick .grade{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:4px}
.lvl-pick .range{font-size:13px;color:var(--ink-soft);margin-bottom:6px}
.lvl-pick .count{font-size:13px;color:var(--ink-soft)}
.lvl-pick .count b{color:var(--brand);font-size:16px}
.lvl-pick .stars{margin-top:8px}

.lvl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;
  padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.lvl-bar .seg{padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);color:var(--ink-soft);transition:.15s;background:transparent}
.lvl-bar .seg:hover{color:var(--brand);border-color:var(--brand)}
.lvl-bar .seg.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.lvl-bar .cnt{margin-left:auto;font-size:13px;color:var(--ink-soft)}
.lvl-bar .cnt b{color:var(--brand)}

.lvl-era-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;
  padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.lvl-era-bar .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:1px}
.lvl-era-bar .chip{padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer;
  border:1px solid var(--line);color:var(--ink-soft);background:transparent;transition:.15s;font-weight:500}
.lvl-era-bar .chip:hover{color:#fff;border-color:var(--brand)}
.lvl-era-bar .chip.active{color:#fff;border-color:transparent}
.lvl-era-bar .chip .yr{font-size:11px;opacity:.7;margin-left:4px}
.lvl-era-bar .cnt{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.lvl-era-bar .cnt b{color:var(--brand)}

.lvl-dyn-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;
  padding:8px 14px;background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.lvl-dyn-bar .lbl{font-size:12px;font-weight:600;color:var(--ink-soft);letter-spacing:1px}
.lvl-dyn-bar .chip{padding:4px 10px;border-radius:999px;font-size:12px;cursor:pointer;
  border:1px solid var(--line);color:var(--ink-soft);background:transparent;transition:.15s;font-weight:500}
.lvl-dyn-bar .chip:hover{color:var(--brand);border-color:var(--brand)}
.lvl-dyn-bar .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.lvl-dyn-bar .chip .n{font-size:11px;opacity:.7;margin-left:3px}
.lvl-dyn-bar .reset{margin-left:8px;font-size:12px;color:var(--brand);cursor:pointer;
  padding:4px 8px;border-radius:999px;border:1px solid var(--brand);background:transparent;transition:.15s}
.lvl-dyn-bar .reset:hover{background:var(--brand);color:#fff}

.lvl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.lvl-item{background:var(--card);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow);transition:.2s;
  display:flex;flex-direction:column;text-decoration:none;color:inherit}
.lvl-item:hover{transform:translateY(-3px);border-color:var(--brand)}
.lvl-cover{aspect-ratio:16/10;background:#eef;width:100%;overflow:hidden;position:relative}
.lvl-cover img{width:100%;height:100%;object-fit:cover;display:block}
.lvl-cover .lvl-badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:999px;color:#fff;background:rgba(0,0,0,.55)}
.lvl-cover .vol-badge{position:absolute;top:8px;right:8px;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:999px;color:#fff;background:rgba(0,0,0,.45)}
.lvl-info{padding:10px 12px 12px}
.lvl-info .t{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lvl-info .a{font-size:12px;color:var(--ink-soft);margin-top:4px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.lvl-info .s{margin-top:6px;display:flex;gap:4px;align-items:center;font-size:11px;color:var(--ink-soft)}

.lvl-pager{margin-top:24px;display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
.lvl-pager button{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);font-size:13px;cursor:pointer;transition:.15s}
.lvl-pager button:hover{color:var(--brand);border-color:var(--brand)}
.lvl-pager button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.lvl-pager button:disabled{opacity:.4;cursor:default}
.lvl-pager .pn{font-size:13px;color:var(--ink-soft);margin:0 4px}
.lvl-pager .pn b{color:var(--brand)}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);font-size:15px}

@media (max-width:600px){
  .lvl-picks{grid-template-columns:1fr}
  .lvl-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .lvl-head h1{font-size:22px}
}
</style>
</head>
<body>
<div id="gw-top"></div>

<div class="container lvl-page">
  <div class="lvl-head">
    <h1>按学段分级阅读</h1>
    <div class="sub">《古文观止》按内容难度分为三级：小学适合初识文言文的启蒙篇，初中可独立阅读并理解主旨，高中挑战文言长文与史论。<br>选一篇，从「原文 + 注音 + 逐句译文」开始，配合生词注释与赏析导读，稳步进阶。</div>
  </div>

  <div class="lvl-picks" id="lvl-picks"></div>

  <div class="lvl-bar" id="lvl-bar"></div>

  <div class="lvl-grid" id="lvl-grid"></div>
  <div class="lvl-pager" id="lvl-pager"></div>
</div>

<div id="gw-bottom"></div>

<script src="data/volumes.js"></script>
<script src="data/articles.js"></script>
<script src="data/authors.js"></script>
<script src="data/quotes.js"></script>
<script src="js/common.js"></script>
<script>
(function () {
  GW.mount("分级学习");

  var params = new URLSearchParams(location.search);
  var level = parseInt(params.get("level"), 10) || 1;
  var prevLevel = parseInt(localStorage.getItem("lvlLevel")||"-1", 10);
  if (level !== prevLevel){ localStorage.removeItem("lvlPage"); }

  var LEVELS = [
    { k: 0, name: "全部",    color: "#555",     label: "ALL",
      grade: "全学段", range: "小学 · 初中 · 高中",
      desc: "222 篇全本一览，按难度排序" },
    { k: 1, name: "小学",    color: "#E2684A",  label: "EASY",
      grade: "小学 4-6 年级", range: "启蒙 · 短文",
      desc: "入门首选，短文易懂、故事性强" },
    { k: 2, name: "初中",    color: "#4A7FC1",  label: "MID",
      grade: "初中 7-9 年级", range: "进阶 · 理解主旨",
      desc: "独立通读，把握人物与道理" },
    { k: 3, name: "高中",    color: "#8A6FB8",  label: "HARD",
      grade: "高中 10-12 年级", range: "挑战 · 长文与史论",
      desc: "长文、史论、政论，锤炼文言功底" }
  ];

  function pickLabel(k){ return k>=1 ? LEVELS.find(function(x){return x.k===k}).name : "全部"; }
  function pickColor(k){ return k>=1 ? LEVELS.find(function(x){return x.k===k}).color : "#555"; }
  function stars(k){
    var s=""; for(var i=0;i<3;i++){ s+=i<k?'<span class="star on">★</span>':'<span class="star">☆</span>'; }
    return s;
  }
  function savePage(){ localStorage.setItem("lvlPage", String(page)); }
  function saveLevel(){ localStorage.setItem("lvlLevel", String(level)); }
  var PAGE_SIZE = 24;
  var page = parseInt(localStorage.getItem("lvlPage")||"1", 10);

  // 学段大卡
  var picks = document.getElementById("lvl-picks");
  picks.innerHTML = LEVELS.slice(1).map(function (lv) {
    var n = ARTICLES.filter(function (a){ return a.difficulty === lv.k; }).length;
    return '<a class="lvl-pick' + (level===lv.k?' active':'') + '" href="?level=' + lv.k + '">' +
      '<span class="tag" style="background:' + lv.color + '">' + lv.label + "</span>" +
      '<div class="grade">' + lv.name + "</div>" +
      '<div class="range">' + lv.range + "</div>" +
      '<div class="count"><b>' + n + "</b> 篇 ｜ " + lv.desc + "</div>" +
      '<div class="stars">' + stars(lv.k) + "</div></a>";
  }).join("");

  // 卷次 tab
  var bar = document.getElementById("lvl-bar");
  var vols = [{ k: 0, name: "全部卷次" }].concat(VOLUMES.map(function (v){ return { k: v.id, name: v.name }; }));

  function list(){
    var volK = parseInt(localStorage.getItem("lvlVol")||"0", 10);
    return ARTICLES
      .filter(function (a){ return level===0 || a.difficulty===level; })
      .filter(function (a){ return volK===0 || a.vol===volK; })
      .sort(function (a,b){ return a.difficulty!==b.difficulty ? a.difficulty-b.difficulty : a.id.localeCompare(b.id); });
  }

  function update(){
    var volK = parseInt(localStorage.getItem("lvlVol")||"0", 10);
    bar.innerHTML = vols.map(function (v) {
      return '<span class="seg' + (v.k===volK?' active':'') + '" data-vol="' + v.k + '">' + v.name + "</span>";
    }).join("") + '<span class="cnt">当前：<b>' + pickLabel(level) + "</b> · 卷次 <b>" + (volK===0?'全部':vols.find(function(x){return x.k===volK}).name) + "</b> · 共 <b>" + list().length + "</b> 篇</span>";
    bar.querySelectorAll(".seg").forEach(function (el) {
      el.addEventListener("click", function () {
        localStorage.setItem("lvlVol", el.getAttribute("data-vol"));
        page = 1; savePage();
        update(); renderGrid();
      });
    });
  }

  function renderGrid(){
    var all = list();
    var total = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
    if (page > total) page = 1, savePage();
    var start = (page-1) * PAGE_SIZE;
    var items = all.slice(start, start + PAGE_SIZE);
    var grid = document.getElementById("lvl-grid");
    if (all.length===0){ grid.innerHTML='<div class="empty-state">该学段暂无篇目，请切换筛选</div>'; pager.innerHTML=''; return; }
    grid.innerHTML = items.map(function (a) {
      var cov = 'assets/covers_thumb/' + a.id + '.jpg';
      var diffName = LEVELS.find(function(x){return x.k===a.difficulty}).name;
      return '<a class="lvl-item" href="article.html?id=' + a.id + '">' +
        '<div class="lvl-cover">' +
          '<img loading="lazy" decoding="async" src="' + cov + '" width="360" height="225" onerror="this.src=\'assets/covers_thumb/v01-001.jpg\'">' +
          '<span class="lvl-badge" style="background:' + pickColor(a.difficulty) + '">' + diffName + "</span>" +
          '<span class="vol-badge">卷' + a.vol + "</span></div>" +
        '<div class="lvl-info">' +
          '<div class="t">' + GW.esc(a.title) + "</div>" +
          '<div class="a">' + GW.esc(a.author + " · " + a.dynasty) + "</div>" +
          '<div class="s"><span class="difficulty">' + stars(a.difficulty) + '</span><span>· 卷' + a.vol + "</span></div></div></a>";
    }).join("");
    renderPager(all.length);
  }

  function renderPager(total){
    var pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    if (pages <= 1){ document.getElementById("lvl-pager").innerHTML=''; return; }
    var html = '<button id="pg-prev"' + (page<=1?' disabled':'') + '>&lt; 上一页</button>';
    html += '<span class="pn">第 <b>' + page + '/' + pages + "</b> 页 · 共 <b>" + total + "</b> 篇</span>";
    html += '<button id="pg-next"' + (page>=pages?' disabled':'') + '>下一页 &gt;</button>';
    var pager = document.getElementById("lvl-pager");
    pager.innerHTML = html;
    document.getElementById("pg-prev").addEventListener("click", function(){ page--; savePage(); renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); });
    document.getElementById("pg-next").addEventListener("click", function(){ page++; savePage(); renderGrid(); window.scrollTo({top:0,behavior:'smooth'}); });
  }

  update();
  saveLevel();
  renderGrid();
})();
</script>
</body>
</html>
