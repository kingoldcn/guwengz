<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读 · 古文观止</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="gw-top"></div>

<div class="container reader-head">
  <div class="crumbs" id="gw-crumbs"></div>
  <div class="reader-title-row" id="gw-title-row"></div>
  <div class="muted" id="gw-meta-line" style="margin-top:6px;font-size:14px"></div>
  <div class="reader-toolbar" id="gw-toolbar"></div>
</div>

<div id="gw-content" class="container">
  <div class="reader-cover" id="gw-cover" style="display:none"></div>
  <div class="reader-layout" id="gw-reader" data-size="18.5">
    <div class="panel" id="gw-sentences"></div>
    <div class="reader-side">
      <div class="panel" id="gw-facts"></div>
      <div class="panel" id="gw-tabs"></div>
    </div>
  </div>
  <div class="reading-nav" id="gw-nav"></div>
</div>

<div id="gw-bottom"></div>

<script src="data/volumes.js"></script>
<script src="data/articles.js"></script>
<script src="data/authors.js"></script>
<script src="data/quotes.js"></script>
<script src="js/common.js"></script>
<script src="js/article.js"></script>
</body>
</html>
